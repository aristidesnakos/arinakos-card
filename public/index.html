:root{--bg:#FAF8F3;--surface:#F0EBE0;--fg:#14213D;--muted:#465170;--line:rgba(20,33,61,.15);--line-strong:rgba(20,33,61,.4);--gold:#C48C28;--btn:#14213D;--btn-fg:#FAF8F3;--focus:#14213D;--shadow:0 14px 28px -18px rgba(20,33,61,.9);--serif:"Brygada",Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.25,1,.5,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1628;--surface:#17223B;--fg:#F3EFE6;--muted:#BAC2D5;--line:rgba(243,239,230,.14);--line-strong:rgba(243,239,230,.38);--gold:#E0B04F;--btn:#E0B04F;--btn-fg:#0E1628;--focus:#E0B04F;--shadow:0 14px 30px -18px rgba(224,176,79,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
a:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:600}
svg{flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card{display:flex;flex-direction:column;justify-content:center;width:100%;max-width:440px;min-height:100vh;min-height:100svh;margin:0 auto;padding:max(36px,env(safe-area-inset-top)) 24px max(32px,env(safe-area-inset-bottom))}
.photo{display:block;width:104px;height:104px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.card h1{margin:26px 0 0;font-size:clamp(44px,12.5vw,54px);line-height:1;letter-spacing:-.025em}
.headline{margin:12px 0 0;color:var(--muted);font-size:20px;line-height:1.35}
.hint{margin:24px 0 0;padding:12px 14px;border:1px solid var(--line-strong);border-radius:12px}
.hint[hidden]{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;margin-top:30px;padding:14px 22px;border-radius:14px;background:var(--btn);color:var(--btn-fg);box-shadow:var(--shadow);font-size:19px;font-weight:600;line-height:1.2;text-decoration:none;transition:transform .15s var(--ease),filter .15s var(--ease)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.985)}
.links{margin-top:22px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;min-height:58px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:19px;font-weight:500;line-height:1.25;text-decoration:none;transition:background-color .15s var(--ease)}
.row:hover{background:var(--surface)}
.row .ic{color:var(--muted)}
.row .lbl{flex:1}
.row .meta{color:var(--muted);font-size:18px;font-weight:400;white-space:nowrap}
.go{color:var(--gold);transition:transform .2s var(--ease)}
.row:hover .go,.more:hover .go{transform:translateX(3px)}
.more{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:16px;margin-top:30px;padding:16px 18px;border-radius:14px;background:var(--surface);text-decoration:none}
.more .t{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2}
.more .s{grid-column:1;color:var(--muted);line-height:1.35}
.more .go{grid-column:2;grid-row:1/3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.btn:active{transform:none}}</style>
</head>
