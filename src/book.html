<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{SITE}}/book">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{SITE}}/book">
<meta property="og:image" content="{{SITE}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{NAME}}, {{HEADLINE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{SITE}}/og.png">
<script type="application/ld+json">{{JSONLD}}</script>
<style>{{CSS}}</style>
</head>
<body>
<main class="book">
  <a class="back" href="/"><img class="mini" src="{{AVATAR}}" width="48" height="48" alt=""><span>{{NAME}}</span></a>
  <h1>{{LABEL}}</h1>
  <p class="facts">{{FACTS}}</p>
  <h2>What we cover</h2>
  <ul>
    {{COVERS}}
  </ul>
  <h2>Who it’s for</h2>
  <ul>
    {{FOR}}
  </ul>
  <h2>Payment and changes</h2>
  <p>{{PAYMENT}}</p>
  <p>{{POLICY}}</p>
  <a class="btn" href="{{URL}}" rel="noopener">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Pick a time</span>
  </a>
  <p class="note">Opens Cal.com, where you choose a slot and pay by card.</p>
</main>
</body>
</html>
