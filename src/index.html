<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{SITE}}/">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="{{NAME}}">
<meta property="og:title" content="{{NAME}} · {{HEADLINE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:url" content="{{SITE}}/">
<meta property="og:image" content="{{SITE}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{NAME}}, {{HEADLINE}}">
<meta property="profile:first_name" content="{{GIVEN}}">
<meta property="profile:last_name" content="{{FAMILY}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{NAME}} · {{HEADLINE}}">
<meta name="twitter:description" content="{{OG_DESC}}">
<meta name="twitter:image" content="{{SITE}}/og.png">
<script type="application/ld+json">{{JSONLD}}</script>
<style>{{CSS}}</style>
</head>
<body>
<main class="home">
  <header class="intro">
    <img class="photo" src="{{AVATAR}}" width="72" height="72" alt="Portrait of {{NAME}}">
    <div class="who">
      <h1>{{NAME}}</h1>
      <p class="headline">{{HEADLINE}}</p>
    </div>
    <a class="pill" href="/contact">Contact card</a>
  </header>
  <section class="block" aria-labelledby="tl">
    <h2 id="tl">{{TL_TITLE}}</h2>
    <ol class="tl">
      {{MOMENTS}}
    </ol>
  </section>
  <footer class="home-foot">
    {{FOOT}}
  </footer>
</main>
</body>
</html>
